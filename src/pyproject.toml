[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "download-github-releases"
description = "Download (and keep in sync) the releases from a set of GitHub projects"
readme = "README.md"
license = "MIT"
authors = [
  {name = "Jason Morley", email = "hello@jbmorley.co.uk"}
]
dependencies = [
  "requests",
]
dynamic = ["version"]

[project.scripts]
download-github-releases = "download_github_releases.download_github_releases:main"
